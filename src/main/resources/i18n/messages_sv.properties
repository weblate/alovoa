faq.open-source.question=Vad betyder öppen källkod? Varför har projektet öppen källkod?
faq.open-source.answer=Öppen källkod betyder i grunden att alla kan se hur varje del av programvaran har skapats, bidra med ändringar och hjälpa till att hitta fel. Vi tror att öppen källkod är framtiden för all teknik.
faq.safari.answer=På grund av Safaris begränsningar stöds webbläsaren inte officiellt. Om du använder macOS rekommenderar vi Firefox. Safari har inte stöd för webbaserade push-aviseringar på någon plattform; begär gärna funktionen <a href="https://developer.apple.com/bug-reporting/">här</a>.
faq.delete-data.answer=Vi är ledsna att se dig lämna oss, men om du är säker klickar du på länken ”Ta bort konto” längst ned på din profilsida. Följ sedan instruktionerna som vi skickar till din e-postadress.
