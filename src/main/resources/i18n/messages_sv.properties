index.for-you.description=Med avancerade filter visar vi dig bara de människor som uppfyller dina kriterier. Därför lägger du mindre tid på att söka och mer tid på att hitta och träffa nya människor.
index.free.description=Denna plattform kräver inte att du betalar någon form av avgift; du är fri att använda alla funktioner utan begränsning. Vi förlitar oss enbart på att era generösa donationer ska hålla plattformen igång.
index.open-source.description=Vi tror på transparens, inte på mörkläggning. Varje kodrad och varje använt bibliotek är fritt tillgängligt som öppen källkod, så att vem som helst kan granska och förbättra plattformen om de vill.
index.private.description=Vi säljer aldrig dina uppgifter till någon; det är ett löfte vi alltid kommer att hålla. Dessutom är dina känsligaste uppgifter starkt krypterade och förblir säkra även vid en dataläcka.
