index.technology.description=Vi använder den senaste tekniken så att du kan dra nytta av de senaste funktionerna på webben. Du kan till exempel installera den här plattformen som en <a href="https://wikipedia.org/wiki/Progressive_web_application">progressiv webbapplikation</a> direkt från din webbläsare!
